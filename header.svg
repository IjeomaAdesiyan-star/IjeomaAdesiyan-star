    LEARN → BUILD → EXPERIMENT → CONTRIBUTE → REPEAT
  </text>

  <circle cx="1120" cy="55" r="5" fill="#38BDF8"/>
  <circle cx="1140" cy="55" r="5" fill="#818CF8"/>
  <circle cx="1160" cy="55" r="5" fill="#A78BFA"/>
</svg>
