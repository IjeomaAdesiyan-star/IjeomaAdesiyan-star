    TRAVEL &amp; OPERATIONS  →  TECHNOLOGY
  </text>

  <text x="80" y="245"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    letter-spacing="1.5">
    CLOUD • DEVOPS • AZURE • AUTOMATION • SOFTWARE
  </text>

  <text x="80" y="286"
    fill="#64748B"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
